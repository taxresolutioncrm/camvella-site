name: Validate Camvella Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camvella-site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Validate Marketing Site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site and sitemap
        run: npm run build

      - name: Verify launch artifacts
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          grep -q "https://camvella.com/" dist/sitemap.xml
          grep -Fq '<title>HOA &amp; Community Association Management Software | Camvella</title>' dist/index.html
          grep -Fq 'Camvella is HOA and community association management software for professional CAM companies' dist/index.html
          grep -q "G-H1ZPCP2EE9" dist/index.html
          grep -q "y62zna7yna" dist/index.html
          grep -q 'id="mobile-menu"' dist/index.html
          grep -q 'src="https://taxrescrm.app/book?product=camvella"' dist/demo/index.html
          ! grep -R -q 'href="https://taxrescrm.app/book?product=camvella"' dist --include='*.html'
          ! grep -R -q '/blog/hoa-accounting-guide' dist --include='*.html'
          ! grep -q '/compare/camvella-vs-buildium' dist/compare/index.html

      - name: Verify live Camvella SEO
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          expected='HOA &amp; Community Association Management Software | Camvella'
          for i in $(seq 1 30); do
            html="$(curl -fsSL --max-time 15 "https://camvella.com/?verify=$(date +%s)" || true)"
            robots="$(curl -fsSL --max-time 15 "https://camvella.com/robots.txt?verify=$(date +%s)" || true)"
            sitemap="$(curl -fsSL --max-time 15 "https://camvella.com/sitemap.xml?verify=$(date +%s)" || true)"
            if printf '%s' "$html" | grep -Fq "$expected" \
              && printf '%s' "$html" | grep -Fq 'Camvella is HOA and community association management software for professional CAM companies' \
              && printf '%s' "$robots" | grep -qi 'Sitemap: https://camvella.com/sitemap.xml' \
              && printf '%s' "$sitemap" | grep -Fq '<loc>https://camvella.com/</loc>'; then
              echo 'Live Camvella SEO verification passed.'
              exit 0
            fi
            echo "Waiting for Camvella production SEO + sitemap ($i/30)..."
            sleep 10
          done
          echo 'Camvella production did not reach the expected SEO version.' >&2
          exit 1
