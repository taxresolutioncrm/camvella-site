name: Portfolio Live SEO Release Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify latest live release markers
        shell: bash
        run: |
          set -euo pipefail
          echo "===== GroundIVO canonical route normalization ====="
          curl -sS -D /tmp/gh -o /dev/null "https://groundivo.com/pricing"
          grep -Ei '^(HTTP/|location:)' /tmp/gh || true
          echo "===== BocaSync guide-hub discovery ====="
          curl -sS -o /tmp/bhome "https://bocasync.com/?verify=$(date +%s)"
          curl -sS -o /tmp/bmap "https://bocasync.com/sitemap.xml?verify=$(date +%s)"
          grep -F 'href="/guides/"' /tmp/bhome | head -n 1
          grep -F '<loc>https://bocasync.com/guides/</loc>' /tmp/bmap | head -n 1
          echo "===== Camvella deployment marker ====="
          for u in             "https://camvella.com/solutions/florida-hoa-management-software/"             "https://camvella.com/solutions/texas-hoa-management-software/"; do
            curl -sS -D /tmp/ch -o /dev/null "$u"
            grep -Ei '^(HTTP/|location:)' /tmp/ch || true
          done
