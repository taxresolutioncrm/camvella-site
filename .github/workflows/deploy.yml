name: Emergency Cloudflare Topology Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect Cloudflare deployment target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== credential presence ==="
          test -n "${CLOUDFLARE_API_TOKEN:-}" && echo "API token: present" || echo "API token: missing"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" && echo "Account ID: present" || echo "Account ID: missing"
          echo "=== wrangler config ==="
          cat wrangler.toml
          echo "=== Pages projects ==="
          npx --yes wrangler@latest pages project list || true
          echo "=== Workers deployments for camvella-site ==="
          npx --yes wrangler@latest deployments list --name camvella-site || true
