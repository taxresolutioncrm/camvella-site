name: Validate Camvella Website SEO and Crawlability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camvella-site-seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Full Marketing Site Build and SEO Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate static website and sitemap
        run: npm run build
      - name: Audit canonical URLs, metadata, sitemap, robots, JSON-LD and crawl paths
        run: node scripts/validate-seo.mjs
      - name: Verify favicon, redirects, and key conversion pages
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/favicon.png
          test -f dist/manifest.json
          grep -Fq 'rel="icon" type="image/png" sizes="96x96" href="/favicon.png"' dist/index.html
          grep -Fq '"src": "/favicon.png"' dist/manifest.json
          test -f dist/_redirects
          grep -Fq '/solutions/florida-hoa-management-software/ /locations/florida/ 301' dist/_redirects
          grep -Fq '/solutions/texas-hoa-management-software/ /locations/texas/ 301' dist/_redirects
          test -f dist/demo/index.html
          test -f dist/pricing/index.html
          test -f dist/blog/index.html
          test -f dist/guides/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/78057e4eedc3de519284327e5fd31bf6.txt
      - name: Submit changed live website URLs via IndexNow
        if: github.event_name == 'push'
        run: node scripts/submit-indexnow.mjs
