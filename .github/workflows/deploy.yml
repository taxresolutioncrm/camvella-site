name: Portfolio Live SEO Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live public SEO surfaces
        shell: bash
        run: |
          set -euo pipefail
          check_site() {
            name="$1"; base="$2"; sitemap="$3"
            echo "===== $name ====="
            stamp="$(date +%s)"
            curl -sS -L -D /tmp/h -o /tmp/body "$base/?verify=$stamp"
            printf 'HOME '; head -n 1 /tmp/h | tail -n 1
            grep -o '<title>[^<]*</title>' /tmp/body | head -n 1 || true
            grep -o '<link[^>]*rel="canonical"[^>]*>' /tmp/body | head -n 1 || true
            grep -o '<meta[^>]*name="robots"[^>]*>' /tmp/body | head -n 1 || true
            curl -sS -L -D /tmp/rh -o /tmp/robots "$base/robots.txt?verify=$stamp"
            printf 'ROBOTS '; head -n 1 /tmp/rh | tail -n 1
            grep -i '^Sitemap:' /tmp/robots || true
            curl -sS -L -D /tmp/sh -o /tmp/sm "$base/$sitemap?verify=$stamp"
            printf 'SITEMAP '; head -n 1 /tmp/sh | tail -n 1
            grep -o '<loc>[^<]*</loc>' /tmp/sm | head -n 3 || true
          }
          check_site "RomyLabs" "https://romylabs.com" "sitemap-index.xml"
          check_site "Camvella" "https://camvella.com" "sitemap.xml"
          check_site "GroundIVO" "https://groundivo.com" "sitemap.xml"
          check_site "BocaSync" "https://bocasync.com" "sitemap.xml"
          check_site "TaxRes" "https://taxrescrm.net" "sitemap.xml"
          check_site "Oculivo" "https://oculivo.com" "sitemap.xml"
          echo "===== Camvella regional aliases ====="
          for u in             "https://camvella.com/solutions/florida-hoa-management-software/"             "https://camvella.com/solutions/texas-hoa-management-software/"; do
            curl -sS -D /tmp/ah -o /dev/null "$u"
            grep -Ei '^(HTTP/|location:)' /tmp/ah || true
          done
