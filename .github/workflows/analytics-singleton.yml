name: Camvella analytics singleton regression
on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/layouts/BaseLayout.astro'
      - 'scripts/check-analytics-singleton.mjs'
      - '.github/workflows/analytics-singleton.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/check-analytics-singleton.mjs
