<style>

.content{padding:26px;max-width:1500px;margin:auto}.pageHead{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:20px}.eyebrow{font-size:11px;color:var(--teal);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.pageHead h1{font-size:28px;margin:4px 0 4px;letter-spacing:-.03em}.pageHead p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700;font-size:12px}.btn.primary{background:var(--teal);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.kpi{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:15px 16px;box-shadow:var(--shadow)}.kpiLabel{font-size:11px;color:var(--muted);font-weight:700}.kpiVal{font-size:25px;font-weight:850;letter-spacing:-.03em;margin:5px 0 1px}.kpiFoot{font-size:11px;color:var(--muted)}.delta{font-size:10px;margin-left:6px;color:var(--teal);font-weight:800}
.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}.gridEqual{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.panelHead{padding:14px 16px;border-bottom:1px solid #edf1f3;display:flex;align-items:center;justify-content:space-between}.panelHead h3{font-size:13px;margin:0}.panelHead span{font-size:11px;color:var(--muted)}.panelBody{padding:4px 16px 10px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf1f3}.item:last-child{border-bottom:0}.item b{font-size:12px}.meta{font-size:11px;color:var(--muted);margin-top:2px}.pill{font-size:10px;padding:4px 7px;border-radius:999px;background:var(--teal2);color:#1e6e67;font-weight:800}.pill.warn{background:#fff4dd;color:#94640d}.pill.red{background:#fdeaea;color:#9f3838}.pill.blue{background:#eaf1f8;color:#35658e}
.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{font-size:10px;color:#768996;text-transform:uppercase;letter-spacing:.05em;background:#f8fafb}.table th,.table td{text-align:left;padding:11px 13px;border-bottom:1px solid #edf1f3;white-space:nowrap}.table td{font-size:12px}.table tr:last-child td{border-bottom:0}.nameCell b{display:block}.nameCell span{font-size:10px;color:var(--muted)}

.profile{display:grid;grid-template-columns:280px 1fr;gap:14px}.profileCard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.profileAvatar{width:58px;height:58px;border-radius:16px;background:#eaf5f5;color:#166d66;display:grid;place-items:center;font-size:20px;font-weight:900}.profileCard h2{font-size:18px;margin:12px 0 2px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.mini div{background:#f7f9fa;border-radius:9px;padding:9px}.mini b{display:block;font-size:12px}.mini span{font-size:10px;color:var(--muted)}.tabs{display:flex;gap:5px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafcfd}.tab{border:0;background:transparent;color:#60747f;padding:7px 9px;border-radius:7px;font-size:11px;font-weight:700}.tab.active{background:#eaf5f4;color:#176c66}

.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}
.modalBackdrop{position:fixed;inset:0;background:rgba(7,24,35,.52);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modalBackdrop.open{display:flex}.modal{width:min(620px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 28px 80px rgba(0,0,0,.24)}.modalHead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.modalHead h3{margin:0;font-size:15px}.modalClose{border:0;background:#f2f5f6;width:31px;height:31px;border-radius:8px;cursor:pointer}.modalBody{padding:18px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fbfcfd;color:var(--ink);outline:none}.field textarea{min-height:100px;resize:vertical}.modalFoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}.toast{position:fixed;right:22px;bottom:22px;background:#102f40;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:60}.toast.show{opacity:1;transform:none}
@media(max-width:1100px){.kpis{grid-template-columns:1fr 1fr}.grid2,.gridEqual,.profile{grid-template-columns:1fr}.app{grid-template-columns:84px 1fr}.logo div:last-child,.navLabel,.groupTitle,.badge{display:none}.groupToggle{justify-content:center;padding:6px 0}.groupChevron{font-size:13px}.logo{justify-content:center}.navBtn{justify-content:center}.content{padding:18px}.cardGrid{grid-template-columns:1fr 1fr}}

</style>

<body>
<div class="app">
<aside class="sidebar"><div class="logo"><div class="logoMark">HI</div><div><b>RomyLabs Insurance</b><span>ACA + Medicare CRM</span></div></div><div id="nav"></div></aside>
<main class="main"><header class="topbar"><div class="search"><input id="search" placeholder="Search clients, policies, carriers, tasks…"></div><div class="account"><div class="avatar">RA</div><div><b>Romy Agency</b><span>Sandbox · backend disconnected</span></div></div></header><div id="view" class="content"></div></main>
</div>
<div id="actionModal" class="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal">
    <div class="modalHead"><h3 id="modalTitle">New record</h3><button class="modalClose" id="modalClose" aria-label="Close">×</button></div>
    <form id="modalForm">

      <div class="modalFoot"><button type="button" class="btn secondary" id="modalCancel">Cancel</button><button type="submit" class="btn primary">Save in sandbox</button></div>
    </form>
  </div>
</div>

<script>
const groups=[
['Command',['overview','manager','reports']],
['Sales',['leads','appointments','clients','client360']],
['Enrollments',['aca','medicare','enrollment','eligibility','plans','evidence']],
['Policy Ops',['policies','service','renewals','requests','portal']],
['Revenue',['commissions','exceptions','mapping']],
['Compliance',['compliance','consent','documents','audit']],
['Carrier Ops',['carriers','contracting','catalog']],
['Team',['tasks','automations','team','permissions']],
['Communications',['inbox','email','phone','sms','fax','voicemail']],['System',['onboarding','communications','advanced','integration','lab','settings']]
];
const labels={overview:'Overview',manager:'Manager Dashboard',reports:'Reports',leads:'Lead Pipeline',appointments:'Appointments',clients:'Clients',client360:'Client 360',aca:'ACA',medicare:'Medicare',enrollment:'Enrollment Queue',eligibility:'Eligibility',plans:'Plan Compare',evidence:'Evidence Bundles',policies:'Policies',service:'Policy Service',renewals:'Renewals',requests:'Portal Requests',portal:'Client Portal',commissions:'Commissions',exceptions:'Exceptions',mapping:'Statement Mapping',compliance:'Compliance',consent:'Consent',documents:'Documents',audit:'Audit Log',carriers:'Carriers',contracting:'Carrier Contracting',catalog:'Product Catalog',tasks:'Tasks',automations:'Automations',team:'Team & Licensing',permissions:'Permissions',onboarding:'Agency Onboarding',communications:'Communications',inbox:'Unified Inbox',email:'Email',phone:'Phone',sms:'SMS',fax:'Fax',voicemail:'Voicemail',advanced:'Advanced Reports',integration:'Integration Readiness',lab:'Integration Lab',settings:'Settings'};
const icons={overview:'▦',manager:'◫',reports:'▥',leads:'◆',appointments:'◷',clients:'●',client360:'◉',aca:'A',medicare:'M',enrollment:'⇢',eligibility:'◎',plans:'⇄',evidence:'▣',policies:'▤',service:'↔',renewals:'↻',requests:'↗',portal:'◌',commissions:'$',exceptions:'!',mapping:'⇆',compliance:'✓',consent:'✓',documents:'▧',audit:'≡',carriers:'◇',contracting:'◇',catalog:'▦',tasks:'☑',automations:'⚡',team:'♙',permissions:'⌘',onboarding:'◎',communications:'✉',inbox:'▣',email:'✉',phone:'☎',sms:'◌',fax:'▧',voicemail:'▶',advanced:'▥',integration:'⌁',lab:'◈',settings:'⚙'};
const status=(t,c='')=>'<span class="pill '+c+'">'+t+'</span>';
const kpi=(l,v,f,d='')=>'<div class="kpi"><div class="kpiLabel">'+l+'</div><div class="kpiVal">'+v+(d?'<span class="delta">'+d+'</span>':'')+'</div><div class="kpiFoot">'+f+'</div></div>';
const head=(e,t,p,actions='')=>'<div class="pageHead"><div><div class="eyebrow">'+e+'</div><h1>'+t+'</h1><p>'+p+'</p></div><div class="actions">'+actions+'</div></div>';
const row=(a,b,s,c='')=>'<div class="item"><div><b>'+a+'</b><div class="meta">'+b+'</div></div>'+status(s,c)+'</div>';
const panel=(title,sub,body)=>'<section class="panel"><div class="panelHead"><h3>'+title+'</h3><span>'+sub+'</span></div><div class="panelBody">'+body+'</div></section>';
let currentRole=null;
const routeRoles={
  overview:['agency_admin','manager','agent','compliance','revenue'],
  manager:['agency_admin','manager'],reports:['agency_admin','manager','compliance','revenue'],
  leads:['agency_admin','manager','agent'],appointments:['agency_admin','manager','agent','compliance'],
  clients:['agency_admin','manager','agent','compliance','revenue'],client360:['agency_admin','manager','agent','compliance','revenue'],
  aca:['agency_admin','manager','agent','compliance'],medicare:['agency_admin','manager','agent','compliance'],
  enrollment:['agency_admin','manager','agent','compliance'],eligibility:['agency_admin','manager','agent','compliance'],
  plans:['agency_admin','manager','agent','compliance'],evidence:['agency_admin','manager','agent','compliance'],
  policies:['agency_admin','manager','agent','compliance','revenue'],service:['agency_admin','manager','agent','compliance'],
  renewals:['agency_admin','manager','agent','compliance','revenue'],requests:['agency_admin','manager','agent','compliance'],
  portal:['agency_admin','manager','agent'],commissions:['agency_admin','manager','agent','revenue'],
  exceptions:['agency_admin','manager','agent','revenue'],mapping:['agency_admin','manager','revenue'],
  compliance:['agency_admin','manager','compliance'],consent:['agency_admin','manager','agent','compliance','revenue'],
  documents:['agency_admin','manager','agent','compliance'],audit:['agency_admin','manager','compliance'],
  carriers:['agency_admin','manager','agent','compliance','revenue'],contracting:['agency_admin','manager','agent','compliance'],
  catalog:['agency_admin','manager','agent','compliance','revenue'],tasks:['agency_admin','manager','agent'],
  automations:['agency_admin','manager'],team:['agency_admin','manager','agent','compliance'],permissions:['agency_admin','manager'],
  inbox:['agency_admin','manager','agent','compliance'],email:['agency_admin','manager','agent','compliance'],
  phone:['agency_admin','manager','agent','compliance'],sms:['agency_admin','manager','agent','compliance'],
  fax:['agency_admin','manager','agent','compliance'],voicemail:['agency_admin','manager','agent','compliance'],
  onboarding:['agency_admin'],communications:['agency_admin','manager','agent','compliance'],advanced:['agency_admin','manager','compliance','revenue'],
  integration:['agency_admin','manager'],lab:['agency_admin','manager'],settings:['agency_admin','manager']
};
function canRoute(route,role=currentRole){return !role||(routeRoles[route]||['agency_admin']).includes(role)}
function actionAllowed(label,role=currentRole){
  if(!role||role==='agency_admin')return true;
  const x=String(label||'').toLowerCase();
  if(role==='manager')return !/(import statement|resolve exception|configure integration)/.test(x);
  if(role==='revenue')return /(statement|commission|exception|export|report|mapping)/.test(x);
  if(role==='compliance')return /(evidence|consent|document|audit|review|export|report|license|certification)/.test(x);
  if(role==='agent')return !/(settings|automation|team member|import statement|resolve exception|configure integration|audit)/.test(x);
  return false;
}
const btn=(t,kind='primary',msg=t)=>actionAllowed(msg)?'<button class="btn '+kind+'" onclick="openAction(\''+msg.replaceAll("'","\\'")+'\')">'+t+'</button>':'';
function applyRoleUi(role){
  currentRole=role||null;
  document.querySelectorAll('.navBtn').forEach(b=>{b.style.display=canRoute(b.dataset.r,currentRole)?'':'none'});
  document.querySelectorAll('.group').forEach(g=>{
    const visible=[...g.querySelectorAll('.navBtn')].some(b=>b.style.display!=='none');
    g.style.display=visible?'':'none';
  });
}
const table=(h,rows)=>'<div class="tableWrap"><table class="table"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
const tr=(cells)=>'<tr>'+cells.map((x,i)=>'<td class="'+(i===0?'nameCell':'')+'">'+x+'</td>').join('')+'</tr>';

'<div class="notice"><b>PRE-SUPABASE BUILD:</b> CRM workflows, communications, permissions, provider adapters, migration stack and security guards are prepared. Live Supabase and production integrations remain intentionally disconnected.</div>'+
'<div class="kpis">'+kpi('Open leads','38','12 need follow-up','+8%')+kpi('Enrollment queue','17','5 need review')+kpi('Renewals','64','14 at risk')+kpi('Commission variance','$4,820','6 exceptions')+'</div>'+
'<div class="grid2">'+panel('Today’s work','Priority queue',row('Maria Alvarez','ACA · appointment at 2:30 PM','Today','blue')+row('Robert King','Medicare enrollment · evidence complete','Review','warn')+row('Marcus Hill','Renewal due in 12 days','At risk','red')+row('Humana statement','Commission exception · $1,210','Open','warn'))+
panel('Agency health','Last 30 days',row('Lead → appointment','62% conversion','Healthy')+row('Appointment → enroll','48% conversion','Healthy')+row('Evidence completeness','94% of active enrollments','Review','warn')+row('Retention','91% active retention','Healthy'))+'</div>'+
'<div class="gridEqual">'+panel('Enrollment mix','ACA + Medicare','<div class="stageRow"><div class="stage active"><b>21</b><span>ACA</span><div class="bar"><div class="fill" style="width:72%"></div></div></div><div class="stage"><b>17</b><span>Medicare</span><div class="bar"><div class="fill" style="width:58%"></div></div></div><div class="stage"><b>8</b><span>Review</span><div class="bar"><div class="fill" style="width:38%"></div></div></div><div class="stage"><b>5</b><span>Submitted</span><div class="bar"><div class="fill" style="width:24%"></div></div></div><div class="stage"><b>4</b><span>Issued</span><div class="bar"><div class="fill" style="width:19%"></div></div></div></div>')+
panel('Compliance alerts','Action required',row('State licenses','3 expire within 45 days','Due','warn')+row('Carrier certifications','2 agents incomplete','Open','red')+row('Consent evidence','3 ACA files missing artifact','Review','warn'))+'</div>'}
function leads(){const rows=[
tr(['<b>Maria Alvarez</b><span>maria@example.com</span>','ACA','Appointment','Organic Search','Jordan Lee','92',status('Hot')]),
tr(['<b>James Wilson</b><span>561-555-0184</span>','Medicare','Quoted','Referral','Casey Morgan','88',status('Warm','blue')]),
tr(['<b>Tasha Green</b><span>tasha@example.com</span>','ACA','Contacted','Paid Search','Jordan Lee','76',status('Follow up','warn')]),
tr(['<b>David Cruz</b><span>772-555-0169</span>','Medicare','New','Landing Page','Taylor Brooks','71',status('New','blue')])
];return head('Sales','Lead Pipeline','Source attribution, scoring, ownership and conversion stages.',btn('+ Add Lead')+btn('Import','secondary'))+
'<div class="kpis">'+kpi('New this week','26','8 ACA · 18 Medicare')+kpi('Appointments set','16','62% booking rate')+kpi('Avg. response','4m 18s','Business hours')+kpi('Lead value','$37,400','Projected annualized')+'</div>'+

function fieldHtml([label,type,options]){
 const id='f-'+label.toLowerCase().replace(/[^a-z0-9]+/g,'-');
 if(type==='textarea')return '<div class="field full"><label for="'+id+'">'+label+'</label><textarea id="'+id+'" name="'+label+'" required></textarea></div>';
 if(type==='select')return '<div class="field"><label for="'+id+'">'+label+'</label><select id="'+id+'" name="'+label+'" required>'+options.split('|').map(x=>'<option>'+x+'</option>').join('')+'</select></div>';

 return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" name="'+label+'" type="'+type+'" required></div>';
}
function sandboxSafeFields(fields={}){
 const out={};
 for(const [k,v] of Object.entries(fields)){
   out[k]=(typeof File!=='undefined'&&v instanceof File)?{name:v.name,size:v.size,type:v.type}:v;
 }
 return out;
}
function recordSandboxAction(action,fields={}){
 const entry={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),action,fields:sandboxSafeFields(fields),created_at:new Date().toISOString()};
 const log=JSON.parse(localStorage.getItem('health-crm-sandbox-actions')||'[]');
 log.unshift(entry);localStorage.setItem('health-crm-sandbox-actions',JSON.stringify(log.slice(0,100)));
 return entry;
}
function exportSandbox(label){
 const log=JSON.parse(localStorage.getItem('health-crm-sandbox-actions')||'[]');

 const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');
 const blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='health-crm-sandbox-'+label.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv';a.click();URL.revokeObjectURL(url);

function runSandboxCommand(label){
 if(globalThis.healthCrmBackend?.mode==='supabase')return false;
 if(/^Export/.test(label)){exportSandbox(label);return true}
 if(label==='Run All Simulations'){
   const names=['email.delivery','sms.inbound','voice.completed','fax.received','cms.plan_response','carrier.commission_statement'];
   names.forEach((name,i)=>recordSandboxAction('Simulation: '+name,{result:'PASS',sequence:i+1}));
   showToast('6 provider simulations passed in sandbox');render();return true;
 }
 if(['Run Audit','Run Eligibility','Run Comparison','Run Readiness Check','Build Bundle','Mark All Reviewed','Start Needs Analysis'].some(x=>label.includes(x))){
   recordSandboxAction(label,{result:'PASS',mode:'sandbox'});
   showToast(label+' completed in sandbox');render();return true;
 }
 return false;
}

   try{
     const result=await globalThis.healthCrmAction(label,{});
     if(result?.deferred)throw new Error('This command needs a selected record or live provider context');

 }

  return '<div class="group '+(collapsed?'collapsed':'')+'" data-group="'+g+'">'+
    '<button class="groupToggle" type="button" aria-expanded="'+(!collapsed)+'">'+
      '<span class="groupTitle">'+g+'</span><span class="groupChevron">⌄</span>'+
    '</button>'+
    '<div class="groupBody"><div class="groupBodyInner">'+
      rs.map(r=>'<button class="navBtn" data-r="'+r+'"><span class="navIcon">'+(icons[r]||'•')+'</span><span class="navLabel">'+labels[r]+'</span>'+(r==='exceptions'?'<span class="badge">6</span>':'')+'</button>').join('')+
    '</div></div></div>';
}).join('');
document.querySelectorAll('.groupToggle').forEach(t=>t.onclick=()=>{
  const g=t.closest('.group');
  g.classList.toggle('collapsed');
  const name=g.dataset.group;
  const collapsed=g.classList.contains('collapsed');
  sidebarState[name]=collapsed;
  localStorage.setItem(sidebarStateKey,JSON.stringify(sidebarState));
  t.setAttribute('aria-expanded',String(!collapsed));
});
document.querySelectorAll('.navBtn').forEach(b=>b.onclick=()=>{
  location.hash=b.dataset.r;
  const g=b.closest('.group');
  if(g&&g.classList.contains('collapsed')){
    g.classList.remove('collapsed');
    const name=g.dataset.group;
    sidebarState[name]=false;
    localStorage.setItem(sidebarStateKey,JSON.stringify(sidebarState));
    const toggle=g.querySelector('.groupToggle');
    if(toggle)toggle.setAttribute('aria-expanded','true');
  }
});
async function runGlobalSearch(query){
  const q=String(query||'').trim();
  if(q.length<2)return;
  if(typeof globalThis.healthCrmSearch!=='function'){
    showToast('Search backend is still initializing');
    return;
  }
  try{
    const results=await globalThis.healthCrmSearch(q);
    if(!results.length){
      showToast(globalThis.healthCrmBackend?.mode==='supabase'?'No matching records':'Sandbox search is local-only until Supabase is connected');
      return;
    }
    document.getElementById('view').innerHTML=head('Search','Global Search','Results across clients, leads and policies for “'+q.replaceAll('<','&lt;')+'”.')+
      '<section class="panel"><div class="panelHead"><h3>Matches</h3><span>'+results.length+' results</span></div><div class="panelBody">'+
      results.map(x=>row(x.title,x.subtitle||x.entity_type,x.entity_type,'blue')).join('')+'</div></section>';
  }catch(error){
    showToast('Search failed: '+(error?.message||'unknown error'));
  }
}
document.getElementById('search').onkeydown=e=>{if(e.key==='Enter')runGlobalSearch(e.target.value)};
addEventListener('health-crm-backend-ready',e=>{
  const sub=document.querySelector('.account span');
  if(sub)sub.textContent=e.detail.mode==='supabase'?'Connected workspace · '+(e.detail.role||'member'):'Sandbox · backend disconnected';
  applyRoleUi(e.detail.mode==='supabase'?e.detail.role:null);
  render();
});
addEventListener('hashchange',render);render();
</script>
