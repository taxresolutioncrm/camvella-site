<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RomyLabs Insurance CRM — Online Sandbox v3</title>
<style>
:root{--ink:#163042;--muted:#6f8290;--line:#dfe8ed;--paper:#fff;--bg:#f4f7f9;--nav:#0d2638;--nav2:#15394f;--teal:#0f746b;--teal2:#e9f7f5;--blue:#285f8f;--gold:#a87313;--red:#b44848;--shadow:0 8px 24px rgba(19,48,66,.06)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,var(--nav),#0b2130);color:#fff;height:100vh;position:sticky;top:0;overflow:auto;padding:18px 14px 20px}
.logo{display:flex;align-items:center;gap:11px;padding:4px 8px 17px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}.logoMark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#58d2c7,#1e8f86);display:grid;place-items:center;font-weight:900;color:#092837}.logo b{font-size:15px;display:block}.logo span{font-size:11px;color:#9cb7c7}
.group{margin-top:15px}.groupTitle{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7795a7;padding:0 10px 7px}.navBtn{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#bcd0db;padding:9px 10px;border-radius:9px;margin:2px 0;text-align:left;cursor:pointer;font-size:13px}.navBtn:hover,.navBtn.active{background:var(--nav2);color:#fff}.navIcon{width:18px;text-align:center;opacity:.9}.badge{margin-left:auto;background:#1d536d;padding:2px 7px;border-radius:999px;font-size:10px;color:#d8edf5}
.main{min-width:0}.topbar{height:72px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}.search{width:min(520px,52vw);position:relative}.search input{width:100%;border:1px solid var(--line);background:#f9fbfc;border-radius:10px;padding:10px 13px 10px 36px;outline:none}.search:before{content:"⌕";position:absolute;left:12px;top:8px;color:#80919d;font-size:18px}.account{display:flex;gap:11px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:#e7f3f4;color:#176c66;display:grid;place-items:center;font-weight:800}.account b{font-size:13px}.account span{display:block;color:var(--muted);font-size:11px}
.content{padding:26px;max-width:1500px;margin:auto}.pageHead{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:20px}.eyebrow{font-size:11px;color:var(--teal);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.pageHead h1{font-size:28px;margin:4px 0 4px;letter-spacing:-.03em}.pageHead p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700;font-size:12px}.btn.primary{background:var(--teal);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
.notice{background:#edf8f6;border:1px solid #c9ebe6;border-radius:12px;padding:11px 13px;margin-bottom:16px;font-size:12px;color:#2b605c}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.kpi{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:15px 16px;box-shadow:var(--shadow)}.kpiLabel{font-size:11px;color:var(--muted);font-weight:700}.kpiVal{font-size:25px;font-weight:850;letter-spacing:-.03em;margin:5px 0 1px}.kpiFoot{font-size:11px;color:var(--muted)}.delta{font-size:10px;margin-left:6px;color:var(--teal);font-weight:800}
.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}.gridEqual{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.panelHead{padding:14px 16px;border-bottom:1px solid #edf1f3;display:flex;align-items:center;justify-content:space-between}.panelHead h3{font-size:13px;margin:0}.panelHead span{font-size:11px;color:var(--muted)}.panelBody{padding:4px 16px 10px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf1f3}.item:last-child{border-bottom:0}.item b{font-size:12px}.meta{font-size:11px;color:var(--muted);margin-top:2px}.pill{font-size:10px;padding:4px 7px;border-radius:999px;background:var(--teal2);color:#1e6e67;font-weight:800}.pill.warn{background:#fff4dd;color:#94640d}.pill.red{background:#fdeaea;color:#9f3838}.pill.blue{background:#eaf1f8;color:#35658e}
.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{font-size:10px;color:#768996;text-transform:uppercase;letter-spacing:.05em;background:#f8fafb}.table th,.table td{text-align:left;padding:11px 13px;border-bottom:1px solid #edf1f3;white-space:nowrap}.table td{font-size:12px}.table tr:last-child td{border-bottom:0}.nameCell b{display:block}.nameCell span{font-size:10px;color:var(--muted)}
.stageRow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:16px}.stage{background:#f7f9fa;border:1px solid var(--line);border-radius:10px;padding:11px}.stage b{display:block;font-size:18px}.stage span{font-size:10px;color:var(--muted)}.stage.active{background:#edf8f6;border-color:#bde8e2}.bar{height:7px;background:#edf2f4;border-radius:999px;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#26a79b,#73d7cf)}
.profile{display:grid;grid-template-columns:280px 1fr;gap:14px}.profileCard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.profileAvatar{width:58px;height:58px;border-radius:16px;background:#eaf5f5;color:#166d66;display:grid;place-items:center;font-size:20px;font-weight:900}.profileCard h2{font-size:18px;margin:12px 0 2px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.mini div{background:#f7f9fa;border-radius:9px;padding:9px}.mini b{display:block;font-size:12px}.mini span{font-size:10px;color:var(--muted)}.tabs{display:flex;gap:5px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafcfd}.tab{border:0;background:transparent;color:#60747f;padding:7px 9px;border-radius:7px;font-size:11px;font-weight:700}.tab.active{background:#eaf5f4;color:#176c66}
.cardGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:14px}.infoCard{border:1px solid var(--line);border-radius:11px;padding:13px}.infoCard h4{margin:0 0 7px;font-size:12px}.infoCard p{margin:4px 0;font-size:11px;color:var(--muted)}
.timeline{padding:8px 16px}.event{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:10px 0}.dot{width:9px;height:9px;border-radius:50%;background:var(--teal);margin-top:5px}.event b{font-size:12px}.event span{font-size:10px;color:var(--muted);display:block;margin-top:2px}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:1100px){.kpis{grid-template-columns:1fr 1fr}.grid2,.gridEqual,.profile{grid-template-columns:1fr}.app{grid-template-columns:84px 1fr}.logo div:last-child,.navLabel,.groupTitle,.badge{display:none}.logo{justify-content:center}.navBtn{justify-content:center}.content{padding:18px}.cardGrid{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.kpis{grid-template-columns:1fr}.topbar{padding:0 14px}.search{width:58vw}.content{padding:12px}.pageHead{align-items:flex-start;flex-direction:column}.cardGrid{grid-template-columns:1fr}.stageRow{grid-template-columns:1fr 1fr}.app{grid-template-columns:66px 1fr}.sidebar{padding:12px 8px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="logo"><div class="logoMark">HI</div><div><b>RomyLabs Insurance</b><span>ACA + Medicare CRM</span></div></div><div id="nav"></div></aside>
<main class="main"><header class="topbar"><div class="search"><input id="search" placeholder="Search clients, policies, carriers, tasks…"></div><div class="account"><div class="avatar">RA</div><div><b>Romy Agency</b><span>Sandbox · backend disconnected</span></div></div></header><div id="view" class="content"></div></main>
</div>
<script>
const groups=[
['Command',['overview','manager','reports']],
['Sales',['leads','appointments','clients','client360']],
['Enrollments',['aca','medicare','enrollment','eligibility','plans','evidence']],
['Policy Ops',['policies','service','renewals','requests','portal']],
['Revenue',['commissions','exceptions','mapping']],
['Compliance',['compliance','consent','documents','audit']],
['Carrier Ops',['carriers','contracting','catalog']],
['Team',['tasks','automations','team','permissions']],
['System',['onboarding','communications','advanced','settings']]
];
const labels={overview:'Overview',manager:'Manager Dashboard',reports:'Reports',leads:'Lead Pipeline',appointments:'Appointments',clients:'Clients',client360:'Client 360',aca:'ACA',medicare:'Medicare',enrollment:'Enrollment Queue',eligibility:'Eligibility',plans:'Plan Compare',evidence:'Evidence Bundles',policies:'Policies',service:'Policy Service',renewals:'Renewals',requests:'Portal Requests',portal:'Client Portal',commissions:'Commissions',exceptions:'Exceptions',mapping:'Statement Mapping',compliance:'Compliance',consent:'Consent',documents:'Documents',audit:'Audit Log',carriers:'Carriers',contracting:'Carrier Contracting',catalog:'Product Catalog',tasks:'Tasks',automations:'Automations',team:'Team & Licensing',permissions:'Permissions',onboarding:'Agency Onboarding',communications:'Communications',advanced:'Advanced Reports',settings:'Settings'};
const icons={overview:'▦',manager:'◫',reports:'▥',leads:'◆',appointments:'◷',clients:'●',client360:'◉',aca:'A',medicare:'M',enrollment:'⇢',eligibility:'◎',plans:'⇄',evidence:'▣',policies:'▤',service:'↔',renewals:'↻',requests:'↗',portal:'◌',commissions:'$',exceptions:'!',mapping:'⇆',compliance:'✓',consent:'✓',documents:'▧',audit:'≡',carriers:'◇',contracting:'◇',catalog:'▦',tasks:'☑',automations:'⚡',team:'♙',permissions:'⌘',onboarding:'◎',communications:'✉',advanced:'▥',settings:'⚙'};
const status=(t,c='')=>'<span class="pill '+c+'">'+t+'</span>';
const kpi=(l,v,f,d='')=>'<div class="kpi"><div class="kpiLabel">'+l+'</div><div class="kpiVal">'+v+(d?'<span class="delta">'+d+'</span>':'')+'</div><div class="kpiFoot">'+f+'</div></div>';
const head=(e,t,p,actions='')=>'<div class="pageHead"><div><div class="eyebrow">'+e+'</div><h1>'+t+'</h1><p>'+p+'</p></div><div class="actions">'+actions+'</div></div>';
const row=(a,b,s,c='')=>'<div class="item"><div><b>'+a+'</b><div class="meta">'+b+'</div></div>'+status(s,c)+'</div>';
const panel=(title,sub,body)=>'<section class="panel"><div class="panelHead"><h3>'+title+'</h3><span>'+sub+'</span></div><div class="panelBody">'+body+'</div></section>';
const btn=(t,kind='primary',msg=t)=>'<button class="btn '+kind+'" onclick="demo(\''+msg.replaceAll("'","\\'")+'\')">'+t+'</button>';
const table=(h,rows)=>'<div class="tableWrap"><table class="table"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
const tr=(cells)=>'<tr>'+cells.map((x,i)=>'<td class="'+(i===0?'nameCell':'')+'">'+x+'</td>').join('')+'</tr>';
function overview(){return head('Agency operations','Command Center','ACA + Medicare production, compliance, retention and revenue in one place.',btn('+ New Lead')+btn('Book Appointment','secondary'))+
'<div class="notice"><b>NEW BUILD · SEP 15:</b> polished navigation, Client 360, manager, commission, compliance and enrollment layouts are live in this preview. Supabase and production integrations remain disconnected.</div>'+
'<div class="kpis">'+kpi('Open leads','38','12 need follow-up','+8%')+kpi('Enrollment queue','17','5 need review')+kpi('Renewals','64','14 at risk')+kpi('Commission variance','$4,820','6 exceptions')+'</div>'+
'<div class="grid2">'+panel('Today’s work','Priority queue',row('Maria Alvarez','ACA · appointment at 2:30 PM','Today','blue')+row('Robert King','Medicare enrollment · evidence complete','Review','warn')+row('Marcus Hill','Renewal due in 12 days','At risk','red')+row('Humana statement','Commission exception · $1,210','Open','warn'))+
panel('Agency health','Last 30 days',row('Lead → appointment','62% conversion','Healthy')+row('Appointment → enroll','48% conversion','Healthy')+row('Evidence completeness','94% of active enrollments','Review','warn')+row('Retention','91% active retention','Healthy'))+'</div>'+
'<div class="gridEqual">'+panel('Enrollment mix','ACA + Medicare','<div class="stageRow"><div class="stage active"><b>21</b><span>ACA</span><div class="bar"><div class="fill" style="width:72%"></div></div></div><div class="stage"><b>17</b><span>Medicare</span><div class="bar"><div class="fill" style="width:58%"></div></div></div><div class="stage"><b>8</b><span>Review</span><div class="bar"><div class="fill" style="width:38%"></div></div></div><div class="stage"><b>5</b><span>Submitted</span><div class="bar"><div class="fill" style="width:24%"></div></div></div><div class="stage"><b>4</b><span>Issued</span><div class="bar"><div class="fill" style="width:19%"></div></div></div></div>')+
panel('Compliance alerts','Action required',row('State licenses','3 expire within 45 days','Due','warn')+row('Carrier certifications','2 agents incomplete','Open','red')+row('Consent evidence','3 ACA files missing artifact','Review','warn'))+'</div>'}
function leads(){const rows=[
tr(['<b>Maria Alvarez</b><span>maria@example.com</span>','ACA','Appointment','Organic Search','Jordan Lee','92',status('Hot')]),
tr(['<b>James Wilson</b><span>561-555-0184</span>','Medicare','Quoted','Referral','Casey Morgan','88',status('Warm','blue')]),
tr(['<b>Tasha Green</b><span>tasha@example.com</span>','ACA','Contacted','Paid Search','Jordan Lee','76',status('Follow up','warn')]),
tr(['<b>David Cruz</b><span>772-555-0169</span>','Medicare','New','Landing Page','Taylor Brooks','71',status('New','blue')])
];return head('Sales','Lead Pipeline','Source attribution, scoring, ownership and conversion stages.',btn('+ Add Lead')+btn('Import','secondary'))+
'<div class="kpis">'+kpi('New this week','26','8 ACA · 18 Medicare')+kpi('Appointments set','16','62% booking rate')+kpi('Avg. response','4m 18s','Business hours')+kpi('Lead value','$37,400','Projected annualized')+'</div>'+
'<div class="panel" style="margin-top:14px"><div class="panelHead"><h3>Active leads</h3><span>38 open</span></div>'+table(['Lead','Market','Stage','Source','Owner','Score','Priority'],rows)+'</div>'}
function client360(){return head('Clients','Client 360','Coverage, household, providers, prescriptions, evidence, service and renewal context.',btn('New Service Request')+btn('Send Portal Invite','secondary'))+
'<div class="profile"><div class="profileCard"><div class="profileAvatar">AR</div><h2>Angela Reed</h2><div class="meta">ACA · Active client since 2024</div><div class="mini"><div><b>Florida</b><span>State</span></div><div><b>4 members</b><span>Household</span></div><div><b>Ambetter</b><span>Carrier</span></div><div><b>12/15/26</b><span>Renewal</span></div></div><div style="margin-top:14px">'+status('Portal active')+' '+status('Evidence complete')+'</div></div>'+
'<section class="panel"><div class="tabs"><button class="tab active">Overview</button><button class="tab">Coverage</button><button class="tab">Household</button><button class="tab">Doctors & Rx</button><button class="tab">Documents</button><button class="tab">Activity</button></div><div class="cardGrid"><div class="infoCard"><h4>Current coverage</h4><p><b>Ambetter Silver Select</b></p><p>$124.18/month after APTC</p><p>Effective 01/01/2026</p></div><div class="infoCard"><h4>Eligibility</h4><p>Household size: 4</p><p>Income: $68,400</p><p>APTC: $812/month</p></div><div class="infoCard"><h4>Providers & prescriptions</h4><p>3 saved providers</p><p>4 prescriptions</p><p>Preferred pharmacy: CVS</p></div><div class="infoCard"><h4>Evidence</h4><p>Consent: complete</p><p>Application review: complete</p><p>Plan comparison: saved</p></div><div class="infoCard"><h4>Service</h4><p>1 open request</p><p>Last contact: Sep 14</p><p>Owner: Jordan Lee</p></div><div class="infoCard"><h4>Renewal</h4><p>Review window opens Nov 1</p><p>Risk: Low</p><p>Auto outreach: enabled</p></div></div><div class="timeline"><div class="event"><div class="dot"></div><div><b>Portal document uploaded</b><span>Sep 14 · Proof of income</span></div></div><div class="event"><div class="dot"></div><div><b>Policy service request created</b><span>Sep 11 · PCP update</span></div></div><div class="event"><div class="dot"></div><div><b>Enrollment issued</b><span>Jan 1 · Ambetter Silver Select</span></div></div></div></section></div>'}
function enrollment(){return head('Enrollment','Unified Enrollment Queue','Move ACA and Medicare cases through controlled lifecycle stages with evidence gates.',btn('New Enrollment'))+
'<div class="kpis">'+kpi('Draft','5','Needs intake')+kpi('Review','8','Evidence + plan review')+kpi('Submitted','5','Awaiting carrier/marketplace')+kpi('Issued','4','Effective coverage')+'</div>'+
'<div class="panel" style="margin-top:14px"><div class="stageRow"><div class="stage"><b>5</b><span>Draft</span></div><div class="stage active"><b>8</b><span>Review</span></div><div class="stage"><b>5</b><span>Submitted</span></div><div class="stage"><b>2</b><span>Approved</span></div><div class="stage"><b>4</b><span>Issued</span></div></div></div>'+
'<div class="grid2">'+panel('Cases needing attention','Evidence gates',row('Angela Reed','ACA · plan comparison pending','Review','warn')+row('Robert King','Medicare · SOA and call evidence complete','Ready')+row('Marcus Hill','ACA · consent artifact missing','Blocked','red'))+
panel('Lifecycle controls','Sandbox actions',row('Advance enrollment','Requires evidence checks','Enabled')+row('Send review summary','Client-facing packet','Enabled')+row('Submit to provider','Live integration not connected','Pending','warn'))+'</div>'}
function commissions(){return head('Revenue','Commissions','Expected vs received, splits, chargebacks and statement reconciliation.',btn('Import Statement')+btn('Export Exceptions','secondary'))+
'<div class="kpis">'+kpi('Expected','$18,420','September')+kpi('Received','$13,600','Posted')+kpi('Variance','$4,820','Needs review')+kpi('Chargebacks','$1,140','3 policies')+'</div>'+
'<div class="grid2">'+panel('Statement reconciliation','Latest batches',row('Humana · Sep 2026','118 rows · 9 unmatched','$1,210 var','warn')+row('Florida Blue · Sep 2026','94 rows · fully matched','Matched')+row('Ambetter · Sep 2026','76 rows · 3 unmatched','$680 var','warn'))+

function compliance(){return head('Compliance','Compliance Center','Consent, licensing, carrier certification, recording references and audit readiness.',btn('Run Audit')+btn('Export Evidence','secondary'))+

'<div class="grid2">'+panel('Evidence controls','Enrollment artifacts',row('ACA consent records','34 / 37 complete','92%','warn')+row('Application review evidence','37 / 37 complete','100%')+row('Medicare call references','49 / 51 linked','96%','warn')+row('Plan comparison snapshots','44 / 44 saved','100%'))+
panel('Agent readiness','Licensing + certifications',row('Jordan Lee','FL / GA licenses · current','Ready')+row('Casey Morgan','Medicare certification due Oct 1','Due','warn')+row('Taylor Brooks','NC license expires Oct 18','Due','red'))+'</div>'}
function manager(){return head('Management','Manager Dashboard','Agent performance, workload, service levels and compliance exceptions.',btn('Create Task'))+
'<div class="kpis">'+kpi('Team conversion','48%','Appointment → enrollment','+3%')+kpi('Open tasks','23','7 overdue')+kpi('Service requests','11','3 SLA risk')+kpi('At-risk renewals','14','Needs outreach')+'</div>'+
'<div class="grid2">'+panel('Agent scoreboard','Current month',row('Jordan Lee','12 enrollments · 58% conversion','On track')+row('Casey Morgan','8 enrollments · 47% conversion','On track')+row('Taylor Brooks','6 enrollments · 36% conversion','Coach','warn'))+
panel('Operational exceptions','Needs manager attention',row('Consent evidence','3 cases','Open','warn')+row('Commission exceptions','6 items','$4,820','red')+row('Carrier contracting','2 appointments incomplete','Pending','warn')+row('Portal service SLA','3 requests > 24h','Review','warn'))+'</div>'}
function portal(){return head('Client experience','Client Portal','Coverage, documents, requests, messages and renewal actions in one member-facing workspace.',btn('Invite Client'))+
'<div class="gridEqual">'+panel('Portal adoption','Client access',row('Angela Reed','Last login Sep 14','Active')+row('Robert King','Last login Sep 12','Active')+row('Marcus Hill','Invitation sent Sep 15','Pending','warn'))+
panel('Open portal requests','Service queue',row('PCP update','Angela Reed · submitted 2h ago','Open','blue')+row('ID card request','Robert King · submitted 7h ago','Open','blue')+row('Address change','Tasha Green · submitted yesterday','SLA risk','warn'))+'</div>'}
function policies(){return head('Policy Ops','Policies','Active coverage, renewal status, effective dates, servicing and history.',btn('Add Policy'))+
'<div class="panel">'+table(['Client','Plan','Market','Carrier','Effective','Renewal','Status'],[
tr(['<b>Angela Reed</b><span>4-person household</span>','Silver Select','ACA','Ambetter','01/01/26','12/15/26',status('Active')]),
tr(['<b>Robert King</b><span>MA-PD</span>','Choice Plus','Medicare','Humana','01/01/26','AEP 2026',status('Active')]),
tr(['<b>Marcus Hill</b><span>Individual</span>','Silver 73','ACA','Florida Blue','01/01/26','11/18/26',status('Renewal due','warn')])
])+'</div>'}
function reports(){return head('Analytics','Reports','Conversion, production, retention, compliance and revenue reporting.',btn('Export CSV','secondary'))+
'<div class="kpis">'+kpi('Lead → appointment','62%','Last 30 days')+kpi('Appointment → enroll','48%','Last 30 days')+kpi('Retention','91%','Rolling 12 months')+kpi('Avg. policy value','$1,184','Annualized commission')+'</div>'+
'<div class="gridEqual">'+panel('Funnel','Last 30 days',row('Leads','126 total','100%')+row('Appointments','78 booked','62%')+row('Completed appointments','64 attended','51%')+row('Enrollments','31 issued','25%'))+
panel('Revenue quality','Commission operations',row('Matched statements','$13,600','74%')+row('Open variance','$4,820','26%','warn')+row('Chargebacks','$1,140','6%','red'))+'</div>'}

'<div class="grid2">'+panel('Current workflow','Operational queue',row('Primary workflow','Configured in sandbox','Active')+row('Evidence + audit','Mapped to future backend','Ready')+row('Permissions','Role model prepared','Review','warn'))+
panel('Integration readiness','Backend boundary',row('Supabase persistence','Not connected','Pending','warn')+row('Live provider feed','Not connected','Pending','warn')+row('Audit model','Prepared','Ready'))+'</div>'}
const views={overview,leads,client360,enrollment,commissions,compliance,manager,portal,policies,reports};
function demo(msg){alert(msg+'\n\nSandbox action only. No production data was changed.');}
function render(){const r=(location.hash||'#overview').slice(1);document.querySelectorAll('.navBtn').forEach(b=>b.classList.toggle('active',b.dataset.r===r));document.getElementById('view').innerHTML=(views[r]||(()=>generic(r)))()}
document.getElementById('nav').innerHTML=groups.map(([g,rs])=>'<div class="group"><div class="groupTitle">'+g+'</div>'+rs.map(r=>'<button class="navBtn" data-r="'+r+'"><span class="navIcon">'+(icons[r]||'•')+'</span><span class="navLabel">'+labels[r]+'</span>'+(r==='exceptions'?'<span class="badge">6</span>':'')+'</button>').join('')+'</div>').join('');
document.querySelectorAll('.navBtn').forEach(b=>b.onclick=()=>location.hash=b.dataset.r);
document.getElementById('search').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim())alert('Search preview: '+e.target.value+'\n\nLive global search will connect with the backend.');};
addEventListener('hashchange',render);render();
