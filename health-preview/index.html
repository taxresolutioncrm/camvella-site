<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RomyLabs Insurance CRM — Online Sandbox</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f8fa;color:#153243}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#0c3147;color:#fff;padding:18px 14px;overflow:auto;height:100vh;position:sticky;top:0}.brand{font-size:20px;font-weight:800;margin:4px 8px 18px}.brand span{color:#6fd7cf}.side button{width:100%;border:0;background:transparent;color:#cfe0e7;text-align:left;padding:10px 12px;border-radius:9px;margin:2px 0;cursor:pointer;font-size:14px}.side button:hover,.side button.active{background:#17465f;color:#fff}.main{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid #dbe4e8;display:flex;justify-content:space-between;align-items:center;padding:0 24px;position:sticky;top:0;z-index:2}.top input{width:min(520px,60vw);border:1px solid #cfdce2;border-radius:10px;padding:11px 13px}.content{padding:24px}.sub{color:#72848d;font-size:13px}.banner{background:#eaf8f6;border:1px solid #bde7e2;padding:12px 14px;border-radius:10px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:#fff;border:1px solid #dbe4e8;border-radius:14px;padding:18px;box-shadow:0 4px 14px rgba(20,50,67,.04)}.card b{font-size:27px;display:block;margin-top:8px}.panel{margin-top:16px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #edf2f4}.row:last-child{border:0}.tag{font-size:12px;padding:5px 8px;background:#e8f7f4;color:#14635c;border-radius:999px}.warn{background:#fff3d8;color:#8a5b00}.btn{border:0;border-radius:9px;padding:9px 12px;background:#0f756c;color:#fff;cursor:pointer}.btn.secondary{background:#eef4f6;color:#244456}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #e8eef0;font-size:14px}.hero{background:linear-gradient(135deg,#0d3248,#126c6d);color:#fff;padding:26px;border-radius:16px;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:29px}.hero p{margin:0;color:#d9edf0}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:900px){.shell{grid-template-columns:78px 1fr}.label{display:none}.grid{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.brand{font-size:0}.brand:before{content:"RL";font-size:18px}.side button{text-align:center}.content{padding:14px}}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><div class="brand">RomyLabs <span>Insurance</span></div><nav id="nav"></nav></aside>
<main class="main">
<header class="top"><input id="search" placeholder="Search clients, leads, policies…"><div><strong>Sandbox Agency</strong><div class="sub">Online preview · backend disconnected</div></div></header>
<div id="view" class="content"></div>
</main>
</div>
<script>
const routes=[
['overview','▦','Overview'],['onboarding','◎','Onboarding'],['leads','◆','Leads'],['clients','●','Clients'],['appointments','◷','Appointments'],['aca','A','ACA'],['medicare','M','Medicare'],['enrollment','⇢','Enrollment Queue'],['policies','▤','Policies'],['service','↔','Policy Service'],['eligibility','◎','Eligibility'],['plans','⇄','Plan Compare'],['renewals','↻','Renewals'],['commissions','$','Commissions'],['exceptions','!','Commission Exceptions'],['communications','✉','Communications'],['documents','▧','Documents'],['consent','✓','Consent'],['tasks','☑','Tasks'],['automations','⚡','Automations'],['carriers','◇','Carriers'],['contracting','◇','Contracting'],['mapping','⇆','Statement Mapping'],['portal','◉','Client Portal'],['manager','▦','Manager'],['client360','◫','Client 360'],['history','↺','Policy History'],['evidence','▣','Evidence Bundles'],['catalog','▦','Product Catalog'],['requests','↗','Portal Requests'],['advanced','▥','Advanced Reports'],['compliance','✓','Compliance'],['reports','▥','Reports'],['team','♙','Team'],['permissions','⌘','Permissions'],['audit','≡','Audit Log'],['settings','⚙','Settings']
];
const leads=[['Maria Alvarez','ACA','Appointment','Web',92],['James Wilson','Medicare','Quoted','Referral',88],['Tasha Green','ACA','Contacted','Campaign',76]];
const clients=[['Angela Reed','ACA','Ambetter','Active'],['Robert King','Medicare','Humana','Active'],['Marcus Hill','ACA','Florida Blue','Renewal Due']];
const enroll=[['Angela Reed','ACA','Review'],['Robert King','Medicare','Submitted'],['Marcus Hill','ACA','Draft']];
const policies=[['Angela Reed','Ambetter Silver','ACA','Active'],['Robert King','Humana MA-PD','Medicare','Active'],['Marcus Hill','Florida Blue Silver','ACA','Renewal Due']];
function tag(x,w=false){return '<span class="tag '+(w?'warn':'')+'">'+x+'</span>'}
function kpi(a,b,c=''){return '<div class="card"><span class="sub">'+a+'</span><b>'+b+'</b><span class="sub">'+c+'</span></div>'}
function rows(items){return items.map(x=>'<div class="row"><div><strong>'+x[0]+'</strong><div class="sub">'+x.slice(1,-1).join(' · ')+'</div></div>'+tag(x[x.length-1],/Due|Draft|Open|Review|Pending|Exception/.test(x[x.length-1]))+'</div>').join('')}
function table(headers,data){return '<table class="table"><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+data+'</tbody></table>'}
function heading(t,s){return '<div class="hero"><h1>'+t+'</h1><p>'+s+'</p></div>'}
const views={
overview:()=>heading('Agency Command Center','ACA + Medicare operations from lead to renewal.')+'<div class="banner"><strong>Online sandbox:</strong> Supabase, CMS, telephony, email and carrier feeds are intentionally disconnected.</div><div class="grid">'+kpi('Open leads','38','Across ACA + Medicare')+kpi('Enrollments','17','Current work queue')+kpi('Renewals','64','Upcoming reviews')+kpi('Commission variance','$4,820','Needs reconciliation')+'</div><div class="cols"><div class="panel"><h3>Enrollment queue</h3>'+rows(enroll)+'</div><div class="panel"><h3>Manager alerts</h3>'+rows([['Consent evidence','3 cases','Open'],['Carrier certification','2 agents','Review'],['Commission exception','$1,260','Open']])+'</div></div>',
leads:()=>heading('Lead Pipeline','Source tracking, scoring, assignments and conversion.')+'<div class="panel">'+table(['Lead','Market','Stage','Source','Score'],leads.map(x=>'<tr>'+x.map(v=>'<td>'+v+'</td>').join('')+'</tr>'))+'<div class="quick"><button class="btn" onclick="demo('Lead created')">+ Add lead</button><button class="btn secondary" onclick="demo('Lead advanced')">Advance stage</button></div></div>',
clients:()=>heading('Clients & Households','Coverage, household, contact and servicing context.')+'<div class="panel">'+table(['Client','Market','Carrier','Status'],clients.map(x=>'<tr>'+x.map(v=>'<td>'+v+'</td>').join('')+'</tr>'))+'</div>',
aca:()=>heading('ACA Workspace','Marketplace enrollment, household eligibility, consent and renewals.')+'<div class="grid">'+kpi('ACA pipeline','21')+kpi('Application review','7')+kpi('SEP cases','5')+kpi('Renewals','39')+'</div><div class="panel"><h3>ACA workflow</h3>'+rows([['Household intake','Eligibility + household data','Complete'],['Consent evidence','Permission + review evidence','Complete'],['Plan comparison','Doctors + drugs + cost','Review'],['Application','Marketplace handoff','Pending']])+'</div>',
medicare:()=>heading('Medicare Workspace','AEP/OEP/SEP, MA/MA-PD/PDP workflows and compliance evidence.')+'<div class="grid">'+kpi('Medicare pipeline','17')+kpi('AEP reviews','44')+kpi('Cert alerts','2')+kpi('Call evidence','96%')+'</div><div class="panel"><h3>Medicare workflow</h3>'+rows([['Needs analysis','Providers + prescriptions','Complete'],['Scope / permission','Evidence linked','Complete'],['Plan comparison','MA / PDP','Review'],['Enrollment','Carrier submission','Pending']])+'</div>',
enrollment:()=>heading('Enrollment Queue','Unified ACA + Medicare lifecycle controls.')+'<div class="panel">'+table(['Client','Market','Status'],enroll.map(x=>'<tr>'+x.map(v=>'<td>'+v+'</td>').join('')+'</tr>'))+'<div class="quick"><button class="btn" onclick="demo('Enrollment advanced')">Advance selected</button></div></div>',
policies:()=>heading('Policies','Active coverage, effective dates, renewal state and service history.')+'<div class="panel">'+table(['Client','Plan','Market','Status'],policies.map(x=>'<tr>'+x.map(v=>'<td>'+v+'</td>').join('')+'</tr>'))+'</div>',
plans:()=>heading('Plan Compare','CMS/carrier-ready comparison workspace.')+'<div class="panel"><h3>Sample comparison</h3><div class="grid">'+kpi('Sample Silver 1','$124/mo','Deductible $1,850')+kpi('Sample Silver 2','$168/mo','Deductible $1,200')+kpi('Sample Gold','$244/mo','Deductible $500')+kpi('Provider fit','3/3','Demo data only')+'</div><div class="quick"><button class="btn" onclick="demo('Comparison refreshed — demo data')">Run sample comparison</button></div></div>',
commissions:()=>heading('Commissions','Expected vs received, splits, chargebacks and reconciliation.')+'<div class="grid">'+kpi('Expected','$18,420')+kpi('Received','$13,600')+kpi('Variance','$4,820')+kpi('Exceptions','6')+'</div><div class="panel">'+rows([['Humana September','Statement imported','$1,210 variance'],['ACA carrier batch','Statement mapped','Matched'],['Agent split review','2 producers','Open']])+'</div>',
compliance:()=>heading('Compliance Center','Evidence, licensing, certifications, call records and audit readiness.')+'<div class="grid">'+kpi('Evidence complete','94%')+kpi('Licenses expiring','3')+kpi('Certifications due','2')+kpi('Audit exceptions','4')+'</div><div class="panel">'+rows([['ACA consent evidence','Agency-wide','Complete'],['Medicare call recording refs','Current month','Review'],['Agent state licenses','3 expirations','Due'],['Annual certification','2 agents','Due']])+'</div>',
manager:()=>heading('Manager Dashboard','Production, workload, compliance and exception management.')+'<div class="grid">'+kpi('Team conversion','48%')+kpi('Open tasks','23')+kpi('Service requests','11')+kpi('At-risk renewals','14')+'</div><div class="cols"><div class="panel"><h3>Agent production</h3>'+rows([['Jordan Lee','12 enrollments','Active'],['Casey Morgan','8 enrollments','Active'],['Taylor Brooks','6 enrollments','Review']])+'</div><div class="panel"><h3>Exceptions</h3>'+rows([['Consent','3 cases','Open'],['Commissions','6 items','Open'],['Contracting','2 carriers','Pending']])+'</div></div>',
portal:()=>heading('Client Portal','Coverage, documents and service requests in one member-facing workspace.')+'<div class="panel">'+rows([['Angela Reed','Portal access','Active'],['Robert King','Portal access','Active'],['Marcus Hill','Invite sent','Pending']])+'<div class="quick"><button class="btn" onclick="demo('Portal invitation queued')">Invite client</button></div></div>',
reports:()=>heading('Reports','Conversion, production, retention and revenue reporting.')+'<div class="grid">'+kpi('Lead → appointment','62%')+kpi('Appointment → enroll','48%')+kpi('Retention','91%')+kpi('Open variance','$4,820')+'</div>',
settings:()=>heading('Settings','Integration readiness and sandbox controls.')+'<div class="panel">'+rows([['Supabase','Not connected','Disconnected'],['CMS Marketplace API','Adapter prepared','Pending'],['Telephony / SMS','Provider pending','Pending'],['Email','Provider pending','Pending'],['Carrier feeds','Provider pending','Pending']])+'</div>'
};
const aliases={onboarding:'Agency Onboarding',appointments:'Appointments',service:'Policy Service',eligibility:'Eligibility Detail',renewals:'Renewals',exceptions:'Commission Exceptions',communications:'Communications',documents:'Documents',consent:'Consent Evidence',tasks:'Tasks',automations:'Automations',carriers:'Carriers',contracting:'Carrier Contracting',mapping:'Statement Mapping',client360:'Client 360',history:'Policy History',evidence:'Evidence Bundles',catalog:'Product Catalog',requests:'Portal Requests',advanced:'Advanced Reports',team:'Team & Licensing',permissions:'Permissions',audit:'Audit Log'};
function generic(r){const title=aliases[r]||routes.find(x=>x[0]===r)?.[2]||'Workspace';return heading(title,'Production-shaped sandbox module prepared for backend integration.')+'<div class="grid">'+kpi('Open','12')+kpi('In progress','7')+kpi('Complete','34')+kpi('Exceptions','3')+'</div><div class="panel">'+rows([['Primary workflow','Configured','Active'],['Evidence / audit','Mapped','Complete'],['Backend persistence','Awaiting Supabase','Pending'],['Role enforcement','Prepared','Review']])+'</div>'}
function render(){const r=(location.hash||'#overview').slice(1);document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('active',b.dataset.r===r));document.getElementById('view').innerHTML=(views[r]||(()=>generic(r)))()}
function demo(msg){alert(msg+'\n\nSandbox action only — no production data was changed.')}
document.getElementById('nav').innerHTML=routes.map(x=>'<button data-r="'+x[0]+'"><span>'+x[1]+'</span> <span class="label">'+x[2]+'</span></button>').join('');
document.querySelectorAll('.side button').forEach(b=>b.onclick=()=>location.hash=b.dataset.r);
document.getElementById('search').oninput=e=>{if(e.target.value.length>2)document.querySelector('.top .sub').textContent='Search active: '+e.target.value};
addEventListener('hashchange',render);render();
</script>
</body></html>
