<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Two-step verification · RomyLabs Insurance CRM</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui;background:#f4f7f9;color:#163042;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid #dfe8ed;border-radius:20px;padding:42px;box-shadow:0 24px 70px rgba(19,48,66,.1)}.mark{width:42px;height:42px;border-radius:11px;background:#65d7ce;color:#0b3035;display:grid;place-items:center;font-weight:900}.card h1{font-size:32px;letter-spacing:-.04em;margin:26px 0 8px}.card p{color:#71828d;line-height:1.6}.qr{display:grid;place-items:center;margin:20px 0}.qr img{width:210px;height:210px}.secret{font-family:ui-monospace,monospace;background:#f4f7f9;border-radius:8px;padding:10px;word-break:break-all;font-size:11px}.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}.field label{font-size:11px;font-weight:800}.field input{padding:12px;border:1px solid #d7e1e6;border-radius:9px;font:inherit;font-size:20px;letter-spacing:.2em;text-align:center}.btn{width:100%;margin-top:16px;border:0;border-radius:9px;background:#0f746b;color:#fff;padding:12px;font-weight:900;cursor:pointer}.status{margin-top:16px;padding:11px;border-radius:9px;background:#eef8f6;color:#165f5a;font-size:12px;line-height:1.5}.hidden{display:none}</style></head>
<body><main class="card"><div class="mark">HI</div><h1>Two-step verification.</h1><p id="instructions">Checking your authenticator setup…</p><div id="enroll" class="hidden"><div class="qr"><img id="qr" alt="Authenticator QR code"></div><div class="secret" id="secret"></div><p>Scan the QR code in your authenticator app, then enter the six-digit code.</p></div><form id="mfaForm" class="hidden"><div class="field"><label for="code">Verification code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div><button id="submit" class="btn" type="submit">Verify</button></form><div id="status" class="status">Validating your session…</div></main><script type="module" src="./mfa-runtime.js"></script></body></html>
