<svg viewBox="0 0 480 300" width="480" height="300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Camvella</title>
  <desc>Camvella stacked logo — dark background variant (green + teal symbol, white wordmark)</desc>

  <!-- Left loop — Camvella green -->
  <path d="M 255 75
    C 245 50, 210 38, 185 48
    C 155 60, 142 88, 148 112
    C 154 136, 178 152, 205 148
    C 228 144, 248 128, 255 108"
    fill="none" stroke="#55B96A" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right loop — Camvella teal -->
  <path d="M 255 108
    C 262 88, 282 72, 305 70
    C 332 68, 355 84, 360 108
    C 365 132, 350 156, 325 162
    C 300 168, 272 156, 255 135"
    fill="none" stroke="#0B8F9C" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Teal crossover -->
  <path d="M 255 108 C 248 118, 238 128, 228 132 C 215 137, 205 135, 205 135"
    fill="none" stroke="#0B8F9C" stroke-width="13" stroke-linecap="round"/>
  <path d="M 255 135 C 248 125, 240 115, 233 110 C 225 105, 215 103, 210 106"
    fill="none" stroke="#0B8F9C" stroke-width="13" stroke-linecap="round"/>

  <!-- Wordmark — white -->
  <text x="240" y="215"
    font-family="Georgia,'Times New Roman',serif"
    font-size="42" font-weight="700" letter-spacing="10"
    text-anchor="middle" fill="#FFFFFF">CAMVELLA</text>

  <!-- Rule -->
  <line x1="80" y1="228" x2="400" y2="228" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>

  <!-- Subtitle -->
  <text x="240" y="248"
    font-family="'Helvetica Neue',Arial,sans-serif"
    font-size="11" font-weight="400" letter-spacing="3.5"
    text-anchor="middle" fill="rgba(255,255,255,0.5)">COMMUNITY ASSOCIATION MANAGEMENT</text>
</svg>